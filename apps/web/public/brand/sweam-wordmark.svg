<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" role="img" aria-label="Sweam" width="740" height="260" style="overflow:visible">
  <title>Sweam</title>
  <defs>
    <linearGradient id="sweamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df0"/>
      <stop offset="0.5" stop-color="#4b86ff"/>
      <stop offset="1" stop-color="#35c7f0"/>
    </linearGradient>
    <style>
      /* Letters are dark for light surfaces and flip to near-white in dark UI,
         so the transparent wordmark reads on either background. */
      .lt { fill: none; stroke: #0b0d12; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) { .lt { stroke: #eef1f7; } }
      .accent { fill: url(#sweamGrad); }
      .wave { fill: none; stroke: url(#sweamGrad); stroke-width: 12; stroke-linecap: round;
              transform-box: view-box; animation: sweam-wave 5s ease-in-out infinite; }
      .m { fill: url(#sweamGrad); transform-box: view-box; transform-origin: 591px 124px;
           animation: sweam-twist 7s linear infinite; }
      svg:hover .m { animation-duration: 2.2s; }
      @keyframes sweam-twist {
        from { transform: perspective(700px) rotateY(0deg); }
        to   { transform: perspective(700px) rotateY(360deg); }
      }
      @keyframes sweam-wave {
        0%, 100% { transform: translateX(0); opacity: 0.85; }
        50%      { transform: translateX(10px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .m, .wave { animation: none; transform: none; }
      }
    </style>
  </defs>

  <path class="wave" d="M46 216 C92 198 132 234 178 216 C224 198 264 234 310 216 C356 198 396 234 442 216 C480 202 506 214 520 210"/>

  <g class="lt">
    <path d="M150 96 C150 70 121 60 96 62 C67 64 52 85 62 105 C71 122 99 125 113 129 C141 137 150 159 138 175 C122 193 88 189 66 177 C56 171 51 163 50 153"/>
    <path d="M168 60 L196 188 L234 110 L272 188 L300 60"/>
    <path d="M392 62 L328 62 L328 188 L392 188 M328 125 L384 125"/>
    <path d="M414 188 L456 60 L498 188 M432 152 L480 152"/>
  </g>

  <polygon class="accent" points="444,106 444,140 470,123"/>

  <g class="m">
    <path d="M520 62 L591 124 L520 186 Z"/>
    <path d="M662 62 L591 124 L662 186 Z"/>
  </g>
</svg>
