# Sweam API worker.
#
# Local development (`wrangler dev`) uses the top-level config and runs D1/R2
# simulations on disk under .wrangler/state; the web app is served by Vite,
# which proxies /api and /media here.
#
# The `preview` environment is the always-on deploy: it serves the built web
# app (apps/web/dist) as static assets AND handles /api + /media from the same
# Worker, so everything is one origin. Deploy with:
#   npm run build -w @sweam/web
#   npx wrangler deploy --env preview

name = "sweam-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[[d1_databases]]
binding = "DB"
database_name = "sweam-db"
database_id = "cb955161-edd2-41d9-8692-7da571815e0d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sweam-media"

[vars]
ENVIRONMENT = "development"
# Shared secret for the transcoder worker's service API. This default is for
# local development only; production deploys must override it with
# `wrangler secret put TRANSCODER_TOKEN` (the API refuses the default value
# when ENVIRONMENT is "production").
TRANSCODER_TOKEN = "dev-transcoder-token"

# No scheduled jobs at the top level. A deploy without --env preview creates a
# separate Worker ("sweam-api") on the SAME database; on 2026-10-19 one did, and
# its 10-minute timer claimed releases before the real announcer. Scheduled jobs
# live only in [env.preview.triggers], and the handler also refuses to run unless
# SCHEDULED_JOBS = "on" (set only in [env.preview.vars]).
[triggers]
crons = []

# ---------------------------------------------------------------------------
# Always-on deploy (workers.dev). Serves the SPA + API from one Worker.
# ---------------------------------------------------------------------------
[env.preview]
name = "sweam"
# Keep the workers.dev URL working alongside the custom domain (adding routes
# would otherwise disable it).
workers_dev = true
# Custom domain, in addition to sweam.hi-3e9.workers.dev. Cloudflare provisions
# the DNS record + edge cert automatically; the zone must be on this account
# (it is — sweam.co uses Cloudflare nameservers).
routes = [
  { pattern = "sweam.co", custom_domain = true },
  { pattern = "www.sweam.co", custom_domain = true },
  # A dedicated entrance to the admin area; the SPA redirects its root to /admin.
  { pattern = "admin.sweam.co", custom_domain = true },
]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "sweam-db"
database_id = "cb955161-edd2-41d9-8692-7da571815e0d"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "sweam-media"

[env.preview.vars]
ENVIRONMENT = "production"
# The scheduled handler runs only where this is "on" (see [triggers] above).
SCHEDULED_JOBS = "on"
# PM Bestie Analytics sync (lib/pmbSync.ts). The write keys are secrets
# (PMB_ANALYTICS_LIVE_KEY, PMB_ANALYTICS_TEST_KEY). Activity of these accounts
# goes to the TEST data, with admins and official accounts: calix, eterna
# (Verbatiim scout), playreviewer (store review account).
PMB_TEAM_USER_IDS = "c398c577-a7ec-4956-8b0a-c945823f0f0d,8347dbe2-5a1f-45d4-a929-09534f389c75,d704e5e4-a5fe-4ba1-8b39-934829d2bebd"
# Falcyn Inc mailing address for the release email footer (CAN-SPAM). While it
# is empty, only Notify-me release emails are sent.
MAIL_POSTAL_ADDRESS = "1207 Delaware Ave #4777, Wilmington, DE 19806"
# TRANSCODER_TOKEN is a secret on this environment (wrangler secret put
# TRANSCODER_TOKEN --env preview); the same value is set on the Fly app
# sweam-transcoder. Never a var here, or the dev default would be live.

# Monthly scout royalty distribution on the deployed Worker.
[env.preview.triggers]
crons = ["0 7 1 * *", "*/10 * * * *"]

# The built web app. The Worker runs first (below) and hands non-API requests
# to this binding; unknown paths fall back to index.html for the SPA router.
[env.preview.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
